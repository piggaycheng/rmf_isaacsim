services:
  # 1. Open-RMF 核心與 Gazebo 模擬節點容器
  rmf:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-rmf:jazzy
    container_name: open_rmf_jazzy
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      # X11 顯示傳發 (讓容器內的 Gazebo / RViz2 可以在本機螢幕顯示)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:rw
      # 本機程式碼與前後端掛載 (主機修改，容器內即時生效)
      - ./workspace:/root/rmf_ws/src/custom_ws:rw
      - ./backend:/root/rmf_ws/backend:rw
      - ./frontend:/root/rmf_ws/frontend:rw

    stdin_open: true
    tty: true
    command: bash

  # 2. RMF Web Studio 前後端整合服務 (FastAPI + WebSocket + React Web)
  web:
    image: open-rmf:jazzy
    container_name: open_rmf_web
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - ./backend:/root/rmf_ws/backend:rw
      - ./frontend:/root/rmf_ws/frontend:rw
    working_dir: /root/rmf_ws/backend
    command: python3 server.py

  # 3. EMQX - MQTT 訊息代理伺服器 (MQTT 3.1.1/5.0, WebSocket, 規則引擎與管理後台)
  emqx:
    image: emqx:latest
    container_name: emqx_broker
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT TCP
      - "8083:8083"      # MQTT over WebSocket (前端瀏覽器直連)
      - "8084:8084"      # MQTT over WSS (安全 WebSocket)
      - "8883:8883"      # MQTT SSL/TLS
      - "18083:18083"    # EMQX Web Dashboard 管理後台 (預設帳號: admin / public)
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  # 4. MediaMTX - 即時影像串流媒體伺服器 (支援 RTSP, RTMP, HLS, WebRTC)
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_server
    restart: unless-stopped
    network_mode: host
    environment:
      - MTX_API=yes
    # 使用 host 網路模式以獲得最佳的低延遲 WebRTC UDP 穿透與推拉流效能
    # 常用監聽連接埠：
    # - 8554: RTSP 影音串流輸入/輸出 (rtsp://localhost:8554/<stream_name>)
    # - 8889: WebRTC (WHEP/WHIP) 低延遲網頁播放 (http://localhost:8889/<stream_name>)
    # - 8888: HLS 串流 (http://localhost:8888/<stream_name>)
    # - 1935: RTMP 串流
    # - 9997: MediaMTX API (http://localhost:9997/v3/paths/list)
    # - 8189/udp: WebRTC ICE 媒體數據傳輸

volumes:
  emqx_data:
  emqx_log:

